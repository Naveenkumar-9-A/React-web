{% extends "admin/change_list.html" %}
{% load static %}

{% block content %}
<style>
.cs-wrap *{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
.cs-wrap{background:#ffffff;padding:20px;border-radius:10px;margin-top:10px}
.cs-title{font-size:17px;font-weight:600;color:#1a1f36;margin-bottom:16px}

/* View tabs (Active / Deleted) */
.cs-view-tabs{display:flex;gap:8px;margin-bottom:14px}
.cs-view-tab{padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;color:#374151;border:1px solid #e3e8ef;background:#fff;font-weight:600}
.cs-view-tab.active{background:#1a1f36;color:#fff !important;border-color:#1a1f36}
.cs-view-tab:hover:not(.active){background:#f6f9fc}

/* User type tabs */
.cs-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;background:#f6f9fc;border:1px solid #e3e8ef;border-radius:8px;padding:4px}
.cs-tab{padding:6px 14px;border-radius:6px;font-size:12.5px;cursor:pointer;color:#697386;border:none;background:none;font-weight:500}
.cs-tab.active{background:#4f46e5;color:#ffffff !important}
.cs-tab:hover:not(.active){background:#ede9fe;color:#4f46e5}

/* Date range tabs - same white style */
.cs-date-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;background:#f6f9fc;border:1px solid #e3e8ef;border-radius:8px;padding:4px}
.cs-date-tab{padding:6px 14px;border-radius:6px;font-size:12.5px;cursor:pointer;color:#697386;border:none;background:none;font-weight:500}
.cs-date-tab.active{background:#4f46e5;color:#ffffff !important}
.cs-date-tab:hover:not(.active){background:#ede9fe;color:#4f46e5}

.cs-search-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cs-search-box{display:flex;align-items:center;gap:6px;background:#f6f9fc;border:1px solid #e3e8ef;border-radius:6px;padding:7px 12px;flex:1;max-width:400px}
.cs-search-box input{border:none;outline:none;font-size:13px;color:#1a1f36 !important;background:transparent;width:100%}
.cs-result{font-size:12px;color:#697386}

/* Bulk action bar */
.cs-bulkbar{display:none;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.cs-bulkbar.show{display:flex}
.cs-bulkbar span{font-size:12.5px;color:#374151;font-weight:600}
.cs-btn-danger{background:#dc2626;color:#fff !important;border:none;border-radius:6px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
.cs-btn-danger:hover{background:#b91c1c}
.cs-btn-restore{background:#16a34a;color:#fff !important;border:none;border-radius:6px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
.cs-btn-restore:hover{background:#15803d}

.cs-table-wrap{background:#ffffff;border:1px solid #e3e8ef;border-radius:10px;overflow:auto}
.cs-table{width:100%;border-collapse:collapse;background:#ffffff;min-width:1020px}
.cs-table thead tr{background:#f6f9fc !important}
.cs-table thead th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#697386 !important;border-bottom:1px solid #e3e8ef;white-space:nowrap;background:#f6f9fc !important}
.cs-table tbody tr{border-bottom:1px solid #f0f4f8;background:#ffffff !important}
.cs-table tbody tr:last-child{border-bottom:none}
.cs-table tbody tr:hover{background:#f8faff !important}
.cs-table tbody td{padding:11px 14px;font-size:13px;color:#1a1f36 !important;background:#ffffff !important;vertical-align:top}
.cs-name{font-weight:600;color:#1a1f36 !important}
.cs-muted{color:#6b7280 !important;font-size:12.5px}
.cs-comment{color:#374151;font-size:12px;max-width:200px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs-comment.expanded{-webkit-line-clamp:unset;display:block}
.cs-comment-toggle{display:block;margin-top:4px;font-size:11px;color:#4f46e5;background:none;border:none;cursor:pointer;padding:0;font-weight:600}

.badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.b-trekker{background:#eef2ff;color:#4f46e5 !important}
.b-organizer{background:#fff7ed;color:#c2410c !important}
.b-other{background:#f0fdf4;color:#166534 !important}

.cs-empty{padding:40px;text-align:center;color:#9ea8b3;font-size:13px;background:#ffffff}
.cs-count{background:#e0e7ff;color:#4f46e5;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:5px}
.cs-time{font-size:11px;color:#9ca3af;display:block;margin-top:2px}

.cs-del-btn{background:#fee2e2;color:#dc2626 !important;border:none;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;font-weight:600;margin-right:4px}
.cs-del-btn:hover{background:#fecaca}
.cs-restore-btn{background:#dcfce7;color:#16a34a !important;border:none;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;font-weight:600;margin-right:4px}
.cs-restore-btn:hover{background:#bbf7d0}
.cs-toast{position:fixed;bottom:20px;right:20px;background:#1a1f36;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;display:none}
</style>

<div class="cs-wrap">
  <div class="cs-title">📬 Contact Submissions</div>

  <!-- VIEW TABS: Active / Deleted -->
  <div class="cs-view-tabs">
    <button class="cs-view-tab active" onclick="switchView('active',this)">📥 Active</button>
    <button class="cs-view-tab" onclick="switchView('deleted',this)">🗑 Deleted <span class="cs-count" id="cnt-deleted-view">0</span></button>
  </div>

  <!-- USER TYPE TABS -->
  <div class="cs-tabs">
    <button class="cs-tab active" onclick="switchTab('All',this)">
      All <span class="cs-count" id="cnt-All">0</span>
    </button>
    <button class="cs-tab" onclick="switchTab('trekker',this)">
      Trekker <span class="cs-count" id="cnt-trekker">0</span>
    </button>
    <button class="cs-tab" onclick="switchTab('organizer',this)">
      Trek Organizer <span class="cs-count" id="cnt-organizer">0</span>
    </button>
    <button class="cs-tab" onclick="switchTab('other',this)">
      Other <span class="cs-count" id="cnt-other">0</span>
    </button>
  </div>

  <!-- DATE RANGE TABS -->
  <div class="cs-date-tabs">
    <button class="cs-date-tab active" onclick="switchDate('all',this)">All Time</button>
    <button class="cs-date-tab" onclick="switchDate('today',this)">Today</button>
    <button class="cs-date-tab" onclick="switchDate('week',this)">This Week</button>
    <button class="cs-date-tab" onclick="switchDate('year',this)">This Year</button>
  </div>

  <!-- SEARCH + BULK ACTIONS -->
  <div class="cs-search-row">
    <div class="cs-search-box">
      🔍
      <input id="csSearch" placeholder="Search name, email, mobile or message…" oninput="renderTable()"/>
    </div>
    <div class="cs-result" id="csResult"></div>
    <div class="cs-bulkbar" id="csBulkBar">
      <span id="csBulkCount">0 selected</span>
      <button type="button" class="cs-btn-danger" id="csBulkDeleteBtn" onclick="bulkSoftDelete()">🗑 Delete Selected</button>
      <button type="button" class="cs-btn-restore" id="csBulkRestoreBtn" onclick="bulkRestore()" style="display:none">♻ Restore Selected</button>
      <button type="button" class="cs-btn-danger" id="csBulkPermDeleteBtn" onclick="bulkPermanentDelete()" style="display:none">🗑 Delete Forever</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="cs-table-wrap">
    <table class="cs-table">
      <thead>
        <tr>
          <th><input type="checkbox" id="csSelectAll" onchange="toggleSelectAll(this)"></th>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Mobile</th>
          <th>User Type</th>
          <th>Trek Category</th>
          <th>Message</th>
          <th>Date & Time</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="csBody"></tbody>
    </table>
    <div id="csEmpty" class="cs-empty" style="display:none">🔍 No results found</div>
  </div>
</div>

<div class="cs-toast" id="csToast"></div>

<!-- Hidden form purely so Django renders {% csrf_token %} and sets the csrftoken cookie for our fetch() calls -->
<form id="csCsrfForm" style="display:none">{% csrf_token %}</form>

{{ submissions|json_script:"submissions-data" }}
<script>
const data = JSON.parse(document.getElementById('submissions-data').textContent);
const SOFT_DELETE_URL = "{% url 'admin:contact_soft_delete' %}";
const RESTORE_URL = "{% url 'admin:contact_restore' %}";
const PERMANENT_DELETE_URL = "{% url 'admin:contact_permanent_delete' %}";

let activeTab = "All";
let activeDateRange = "all";
let activeView = "active"; // "active" or "deleted"
const TAB_KEYS = ["All", "trekker", "organizer", "other"];
const selectedIds = new Set();

function getCookie(name){
  let cookieValue = null;
  if(document.cookie && document.cookie !== ''){
    const cookies = document.cookie.split(';');
    for(let c of cookies){
      c = c.trim();
      if(c.startsWith(name+'=')){
        cookieValue = decodeURIComponent(c.substring(name.length+1));
        break;
      }
    }
  }
  return cookieValue;
}

function getCsrfToken(){
  // Prefer reading directly from the rendered hidden input (works even if
  // CSRF_COOKIE_HTTPONLY or CSRF_USE_SESSIONS is enabled in settings.py)
  const input = document.querySelector('#csCsrfForm input[name="csrfmiddlewaretoken"]');
  if(input && input.value) return input.value;
  return getCookie('csrftoken');
}

async function postIds(url, ids){
  const resp = await fetch(url, {
    method: 'POST',
    credentials: 'same-origin',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCsrfToken()
    },
    body: JSON.stringify({ids: ids})
  });
  if(!resp.ok){
    showToast("Something went wrong. Please try again.");
    throw new Error("Request failed: " + resp.status);
  }
  return resp.json();
}

function showToast(msg){
  const t = document.getElementById("csToast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(()=>{ t.style.display = "none"; }, 2500);
}

function parseDate(str){ return str ? new Date(str) : null; }

function isInRange(dateStr, range){
  if(range === "all") return true;
  const d = parseDate(dateStr);
  if(!d) return false;
  const now = new Date();
  if(range === "today"){
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  }
  if(range === "week"){
    const start = new Date(now);
    start.setDate(now.getDate()-now.getDay());
    start.setHours(0,0,0,0);
    return d >= start;
  }
  if(range === "year") return d.getFullYear()===now.getFullYear();
  return true;
}

function viewFiltered(){
  return data.filter(d => activeView === "deleted" ? d.is_deleted : !d.is_deleted);
}

function countFor(tab){
  const byView = viewFiltered();
  const byDate = byView.filter(d => isInRange(d.created_at, activeDateRange));
  return tab==="All" ? byDate.length : byDate.filter(d=>d.user_type===tab).length;
}

function initCounts(){
  TAB_KEYS.forEach(t => {
    const el = document.getElementById("cnt-"+t);
    if(el) el.textContent = countFor(t);
  });
  document.getElementById("cnt-deleted-view").textContent = data.filter(d=>d.is_deleted).length;
}

function switchTab(tab, btn){
  activeTab = tab;
  document.getElementById("csSearch").value = "";
  document.querySelectorAll(".cs-tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderTable();
}

function switchDate(range, btn){
  activeDateRange = range;
  document.getElementById("csSearch").value = "";
  document.querySelectorAll(".cs-date-tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  initCounts();
  renderTable();
}

function switchView(view, btn){
  activeView = view;
  selectedIds.clear();
  document.getElementById("csSearch").value = "";
  document.querySelectorAll(".cs-view-tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("csBulkDeleteBtn").style.display = view==="active" ? "inline-block" : "none";
  document.getElementById("csBulkRestoreBtn").style.display = view==="deleted" ? "inline-block" : "none";
  document.getElementById("csBulkPermDeleteBtn").style.display = view==="deleted" ? "inline-block" : "none";
  initCounts();
  renderTable();
}

function badgeClass(t){
  if(t==="trekker") return "b-trekker";
  if(t==="organizer") return "b-organizer";
  return "b-other";
}

function badgeLabel(t){
  if(t==="trekker") return "Trekker";
  if(t==="organizer") return "Trek Organizer";
  return "Other";
}

function categoryLabel(c){
  const map={adventure:"Adventure Treks",weekend:"Weekend Treks",nature:"Nature Escapes",beach:"Beach Treks",camping:"Camping Treks",spiritual:"Spiritual Treks"};
  return map[c]||c||"—";
}

function formatDateTime(str){
  if(!str) return "—";
  const d = new Date(str);
  if(isNaN(d)) return str;
  const date = d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  const time = d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
  return `<span style="color:#374151">${date}</span><span class="cs-time">⏰ ${time}</span>`;
}

function updateBulkBar(){
  const bar = document.getElementById("csBulkBar");
  const countEl = document.getElementById("csBulkCount");
  if(selectedIds.size > 0){
    bar.classList.add("show");
    countEl.textContent = selectedIds.size + " selected";
  } else {
    bar.classList.remove("show");
  }
  const selectAll = document.getElementById("csSelectAll");
  const visibleCheckboxes = document.querySelectorAll(".cs-row-check");
  const visibleChecked = document.querySelectorAll(".cs-row-check:checked");
  selectAll.checked = visibleCheckboxes.length>0 && visibleChecked.length===visibleCheckboxes.length;
  selectAll.indeterminate = visibleChecked.length>0 && visibleChecked.length<visibleCheckboxes.length;
}

function toggleRowCheck(id, checked){
  if(checked) selectedIds.add(String(id)); else selectedIds.delete(String(id));
  updateBulkBar();
}

function toggleSelectAll(box){
  document.querySelectorAll(".cs-row-check").forEach(cb=>{
    cb.checked = box.checked;
    const id = cb.getAttribute("data-id");
    if(box.checked) selectedIds.add(id); else selectedIds.delete(id);
  });
  updateBulkBar();
}

function markLocalDeleted(ids, isDeleted){
  const idSet = new Set(ids.map(String));
  data.forEach(d=>{
    if(idSet.has(String(d.id))) d.is_deleted = isDeleted;
  });
  selectedIds.clear();
  initCounts();
}

function removeLocal(ids){
  const idSet = new Set(ids.map(String));
  for(let i=data.length-1;i>=0;i--){
    if(idSet.has(String(data[i].id))) data.splice(i,1);
  }
  selectedIds.clear();
  initCounts();
}

async function deleteOne(id){
  if(!confirm("Move this submission to Deleted? You can restore it later.")) return;
  await postIds(SOFT_DELETE_URL, [id]);
  markLocalDeleted([id], true);
  showToast("Moved to Deleted");
  renderTable();
}

async function restoreOne(id){
  if(!confirm("Restore this submission?")) return;
  await postIds(RESTORE_URL, [id]);
  markLocalDeleted([id], false);
  showToast("Restored");
  renderTable();
}

async function permanentDeleteOne(id){
  if(!confirm("Permanently delete this submission? This CANNOT be undone.")) return;
  await postIds(PERMANENT_DELETE_URL, [id]);
  removeLocal([id]);
  showToast("Deleted permanently");
  renderTable();
}

async function bulkSoftDelete(){
  const ids = Array.from(selectedIds);
  if(ids.length===0) return;
  if(!confirm(`Move ${ids.length} submission(s) to Deleted?`)) return;
  await postIds(SOFT_DELETE_URL, ids);
  markLocalDeleted(ids, true);
  showToast(`${ids.length} moved to Deleted`);
  renderTable();
}

async function bulkRestore(){
  const ids = Array.from(selectedIds);
  if(ids.length===0) return;
  if(!confirm(`Restore ${ids.length} submission(s)?`)) return;
  await postIds(RESTORE_URL, ids);
  markLocalDeleted(ids, false);
  showToast(`${ids.length} restored`);
  renderTable();
}

async function bulkPermanentDelete(){
  const ids = Array.from(selectedIds);
  if(ids.length===0) return;
  if(!confirm(`Permanently delete ${ids.length} submission(s)? This CANNOT be undone.`)) return;
  await postIds(PERMANENT_DELETE_URL, ids);
  removeLocal(ids);
  showToast(`${ids.length} deleted permanently`);
  renderTable();
}

function renderTable(){
  const q = document.getElementById("csSearch").value.toLowerCase();
  let rows = viewFiltered().filter(d=>isInRange(d.created_at, activeDateRange));
  if(activeTab!=="All") rows = rows.filter(d=>d.user_type===activeTab);
  if(q){
    rows = rows.filter(d=>
      (d.name||"").toLowerCase().includes(q)||
      (d.email||"").toLowerCase().includes(q)||
      (d.mobile||"").includes(q)||
      (d.comment||"").toLowerCase().includes(q)
    );
  }

  document.getElementById("csResult").textContent = rows.length+" result"+(rows.length!==1?"s":"");
  const tbody = document.getElementById("csBody");
  const empty = document.getElementById("csEmpty");

  if(!rows.length){
    tbody.innerHTML="";
    empty.style.display="block";
    updateBulkBar();
    return;
  }
  empty.style.display="none";
  tbody.innerHTML = rows.map((r,i)=>{
    const actionHtml = activeView === "active"
      ? `<button type="button" class="cs-del-btn" onclick="deleteOne('${r.id}')">🗑 Delete</button>`
      : `<button type="button" class="cs-restore-btn" onclick="restoreOne('${r.id}')">♻ Restore</button><button type="button" class="cs-del-btn" onclick="permanentDeleteOne('${r.id}')">🗑 Forever</button>`;
    return `
    <tr>
      <td><input type="checkbox" class="cs-row-check" data-id="${r.id}" ${selectedIds.has(String(r.id))?"checked":""} onchange="toggleRowCheck('${r.id}', this.checked)"></td>
      <td class="cs-muted">${i+1}</td>
      <td><span class="cs-name">${r.name||"—"}</span></td>
      <td><span class="cs-muted">${r.email||"—"}</span></td>
      <td style="color:#1a1f36;font-weight:500">${r.mobile||"—"}</td>
      <td><span class="badge ${badgeClass(r.user_type)}">${badgeLabel(r.user_type)}</span></td>
      <td><span class="cs-muted">${categoryLabel(r.trek_category)}</span></td>
      <td><span class="cs-comment" id="comment-${i}">${r.comment||"—"}</span>${(r.comment||"").length>60?`<button class="cs-comment-toggle" onclick="toggleComment(${i})">Show more</button>`:""}</td>
      <td>${formatDateTime(r.created_at)}</td>
      <td>${actionHtml}</td>
    </tr>
  `;}).join("");
  updateBulkBar();
}

function toggleComment(i){
  const el = document.getElementById("comment-"+i);
  const btn = el.nextElementSibling;
  el.classList.toggle("expanded");
  btn.textContent = el.classList.contains("expanded") ? "Show less" : "Show more";
}

initCounts();
renderTable();
</script>
{% endblock %}
