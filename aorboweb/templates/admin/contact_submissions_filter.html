{% extends "admin/change_list.html" %}
{% load static %}

{% block content %}

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
.wrap{background:#f6f9fc;padding:20px}
.page-title{font-size:17px;font-weight:600;color:#1a1f36;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;background:#fff;border:1px solid #e3e8ef;border-radius:8px;padding:4px}
.tab{padding:6px 14px;border-radius:6px;font-size:12.5px;cursor:pointer;color:#697386;border:none;background:none;font-weight:500;white-space:nowrap}
.tab.active{background:#4f46e5;color:#fff}
.tab:hover:not(.active){background:#f0f4ff;color:#4f46e5}
.search-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.search-box{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #e3e8ef;border-radius:6px;padding:7px 12px;flex:1}
.search-box input{border:none;outline:none;font-size:13px;color:#1a1f36;background:transparent;width:100%}
.result-info{font-size:12px;color:#697386;white-space:nowrap}
.table-wrap{background:#fff;border:1px solid #e3e8ef;border-radius:10px;overflow:hidden;margin-top:12px}
table{width:100%;border-collapse:collapse}
thead tr{background:#f6f9fc}
thead th{padding:9px 12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:#697386;border-bottom:1px solid #e3e8ef}
tbody tr{border-bottom:1px solid #f0f4f8}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#f8faff}
tbody td{padding:10px 12px;font-size:12.5px;color:#1a1f36}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.b-trekker{background:#eef2ff;color:#4f46e5}
.b-organizer{background:#fff7ed;color:#c2410c}
.b-other{background:#f0fdf4;color:#166534}
.muted{color:#9ea8b3;font-size:12px}
.empty{padding:32px;text-align:center;color:#9ea8b3;font-size:13px}
.count-badge{background:#e0e7ff;color:#4f46e5;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;margin-left:4px}
</style>

<div class="wrap">
  <div class="page-title">📬 Contact Submissions</div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('All', this)">
      All <span class="count-badge" id="count-All"></span>
    </button>
    <button class="tab" onclick="switchTab('trekker', this)">
      Trekker <span class="count-badge" id="count-trekker"></span>
    </button>
    <button class="tab" onclick="switchTab('trek_organizer', this)">
      Trek Organizer <span class="count-badge" id="count-trek_organizer"></span>
    </button>
    <button class="tab" onclick="switchTab('other', this)">
      Other <span class="count-badge" id="count-other"></span>
    </button>
  </div>

  <!-- SEARCH -->
  <div class="search-row">
    <div class="search-box">
      🔍
      <input id="searchInput" placeholder="Search by name, email or mobile…" oninput="renderTable()"/>
    </div>
    <div class="result-info" id="resultInfo"></div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Mobile</th>
          <th>User Type</th>
          <th>Trek Category</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty" style="display:none">
      No results found
    </div>
  </div>
</div>

<script>
// ── Django passes all data here via json_script ──
const raw = document.getElementById("submissions-data");
const data = raw ? JSON.parse(raw.textContent) : [];

let activeTab = "All";

function countFor(tab){
  if(tab==="All") return data.length;
  return data.filter(d => d.user_type === tab).length;
}

function updateCounts(){
  ["All","trekker","trek_organizer","other"].forEach(t => {
    const el = document.getElementById("count-" + t);
    if(el) el.textContent = countFor(t);
  });
}

function switchTab(tab, btn){
  activeTab = tab;
  document.getElementById("searchInput").value = "";
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderTable();
}

function badgeClass(t){
  if(t==="trekker") return "b-trekker";
  if(t==="trek_organizer") return "b-organizer";
  return "b-other";
}

function badgeLabel(t){
  if(t==="trekker") return "Trekker";
  if(t==="trek_organizer") return "Trek Organizer";
  return "Other";
}

function renderTable(){
  const q = document.getElementById("searchInput").value.toLowerCase();
  let filtered = activeTab === "All" ? data : data.filter(d => d.user_type === activeTab);
  if(q){
    filtered = filtered.filter(d =>
      (d.name||"").toLowerCase().includes(q) ||
      (d.email||"").toLowerCase().includes(q) ||
      (d.mobile||"").includes(q)
    );
  }

  document.getElementById("resultInfo").textContent = filtered.length + " result" + (filtered.length !== 1 ? "s" : "");

  const tbody = document.getElementById("tableBody");
  const empty = document.getElementById("emptyState");

  if(!filtered.length){
    tbody.innerHTML = "";
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";
  tbody.innerHTML = filtered.map(r => `
    <tr>
      <td style="font-weight:500">${r.name || "—"}</td>
      <td class="muted">${r.email || "—"}</td>
      <td>${r.mobile || "—"}</td>
      <td><span class="badge ${badgeClass(r.user_type)}">${badgeLabel(r.user_type)}</span></td>
      <td class="muted">${r.trek_category || "—"}</td>
      <td class="muted">${r.created_at || "—"}</td>
    </tr>
  `).join("");
}

updateCounts();
renderTable();
</script>

<!-- Django injects data here -->
{{ submissions_json|json_script:"submissions-data" }}

{% endblock %}
